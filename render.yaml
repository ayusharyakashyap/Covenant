# One-click deploy on Render: New → Blueprint → point at this repo.
services:
  - type: web
    name: covenant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: AUTO_RELEASE_THRESHOLD
        value: "0.8"
