name: CI
# Manual for now: the GitHub account's Actions are paused by a billing issue.
# Once Settings → Billing is resolved, restore automatic runs by adding:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval -- --offline
      - run: npm run build
